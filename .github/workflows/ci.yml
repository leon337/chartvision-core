name: CI

on:
  push:
  pull_request:

jobs:
  governance:
    name: governance-memory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify mandatory project memory
        run: |
          required=(
            "AGENTS.md"
            "docs/PROJECT_STATE.md"
            "docs/SCOPE.md"
            "docs/ROADMAP.md"
            "docs/DECISIONS.md"
            "docs/CONTINUITY_PROTOCOL.md"
            "docs/CHATGPT_PROJECT_INSTRUCTIONS.md"
            "docs/architecture.md"
            "docs/replay_system.md"
            "docs/vision_pipeline.md"
            "docs/evaluation_metrics.md"
            ".agents/skills/chartvision-phase-start/SKILL.md"
            ".agents/skills/chartvision-phase-close/SKILL.md"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty mandatory memory file: $file"; exit 1; }
          done
      - name: Verify frozen roadmap anchors
        run: |
          grep -q "FASE 0 — FOUNDATION" docs/ROADMAP.md
          grep -q "FASE 1 — REPLAY MVP" docs/ROADMAP.md
          grep -q "FASE 8 — DASHBOARD MVP" docs/ROADMAP.md
          grep -q "FASE 0 — FOUNDATION" docs/PROJECT_STATE.md
          grep -q "FASE 1 — REPLAY MVP" docs/PROJECT_STATE.md
      - name: Verify phase lifecycle skills
        run: |
          grep -q '^name: chartvision-phase-start$' .agents/skills/chartvision-phase-start/SKILL.md
          grep -q '^description:' .agents/skills/chartvision-phase-start/SKILL.md
          grep -q 'PHASE_START' .agents/skills/chartvision-phase-start/SKILL.md
          grep -q '^name: chartvision-phase-close$' .agents/skills/chartvision-phase-close/SKILL.md
          grep -q '^description:' .agents/skills/chartvision-phase-close/SKILL.md
          grep -q 'PHASE_CLOSE' .agents/skills/chartvision-phase-close/SKILL.md
          grep -q 'D-015 — Um chat dedicado por fase' docs/DECISIONS.md
          grep -q 'D-016 — Lifecycle de fase padronizado por skills' docs/DECISIONS.md

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Lint backend
        working-directory: backend
        run: ruff check app
      - name: Test backend
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build

  foundation:
    name: foundation-docker
    runs-on: ubuntu-latest
    needs: [governance, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start complete stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify backend health
        run: |
          response="$(curl --fail --silent --show-error http://localhost:8000/health)"
          echo "$response"
          echo "$response" | grep -q '"status":"ok"'
      - name: Verify frontend
        run: curl --fail --silent --show-error http://localhost:5173 >/dev/null
      - name: Show service state
        run: docker compose ps
      - name: Stop stack
        if: always()
        run: docker compose down -v
