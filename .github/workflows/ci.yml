name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: ruff check app
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build

  foundation:
    name: foundation-docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start complete stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify backend health
        run: |
          response="$(curl --fail --silent --show-error http://localhost:8000/health)"
          echo "$response"
          echo "$response" | grep -q '"status":"ok"'
      - name: Verify frontend
        run: curl --fail --silent --show-error http://localhost:5173 >/dev/null
      - name: Show service state
        run: docker compose ps
      - name: Stop stack
        if: always()
        run: docker compose down -v
